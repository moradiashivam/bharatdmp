<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project connection map</title>
<style>
  :root { --bg:#0f172a; --panel:#111c33; --line:#1e293b; --text:#e2e8f0; --muted:#94a3b8; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  .stat { color:var(--muted); font-size:12px; }
  input[type=search], select { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:6px 10px; }
  .wrap { display:flex; height:calc(100vh - 57px); }
  canvas { flex:1; display:block; cursor:grab; }
  aside { width:320px; border-left:1px solid var(--line); padding:14px; overflow:auto; background:var(--panel); }
  aside h2 { font-size:14px; margin:0 0 6px; word-break:break-all; }
  aside ul { margin:4px 0 14px; padding-left:16px; }
  aside li { font-size:12px; color:var(--muted); word-break:break-all; }
  .legend { display:flex; flex-wrap:wrap; gap:8px; }
  .legend span { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:4px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .tag { font-size:10px; border:1px solid var(--line); border-radius:4px; padding:1px 5px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Project connection map</h1>
  <span class="stat" id="stats"></span>
  <input type="search" id="q" placeholder="Search a file...">
  <select id="kind"><option value="">All kinds</option></select>
  <span class="legend" id="legend"></span>
</header>
<div class="wrap">
  <canvas id="c"></canvas>
  <aside id="side"><p class="stat">Click any dot to see what it connects to. Drag the background to pan, scroll to zoom, double-click to fit.</p></aside>
</div>
<script>
const DATA = /*__GRAPH_DATA__*/null;
const COLORS = { controller:'#60a5fa', route:'#f59e0b', service:'#34d399', middleware:'#f472b6', model:'#a78bfa',
  view:'#fbbf24', 'browser script':'#22d3ee', database:'#fb7185', table:'#fca5a5', support:'#94a3b8', test:'#64748b', other:'#cbd5e1' };

const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const byId = new Map();
const nodes = DATA.nodes.map((n,i) => {
  const a = i / DATA.nodes.length * Math.PI * 2, r = 260 + (i % 7) * 40;
  const o = Object.assign({}, n, { x: Math.cos(a)*r, y: Math.sin(a)*r, vx:0, vy:0,
    r: Math.max(4, Math.min(16, 4 + Math.sqrt(n.inbound + n.outbound) * 2.4)) });
  byId.set(n.id, o); return o;
});
const links = DATA.edges.map(e => ({ s: byId.get(e.source), t: byId.get(e.target), kind: e.kind, conf: e.confidence }))
  .filter(l => l.s && l.t);

document.getElementById('stats').textContent =
  DATA.counts.files + ' files - ' + DATA.counts.edges + ' connections (' + DATA.counts.inferred + ' unresolved)';
const kinds = [...new Set(nodes.map(n => n.group))].sort();
const kindSel = document.getElementById('kind'), legend = document.getElementById('legend');
kinds.forEach(k => {
  kindSel.insertAdjacentHTML('beforeend', '<option>' + k + '</option>');
  legend.insertAdjacentHTML('beforeend',
    '<span><i class="dot" style="background:' + (COLORS[k]||'#cbd5e1') + '"></i>' + k + '</span>');
});

let view = { x:0, y:0, k:0.9 }, selected = null, query = '', kindFilter = '';
function resize(){ canvas.width = canvas.clientWidth * devicePixelRatio; canvas.height = canvas.clientHeight * devicePixelRatio; }
window.addEventListener('resize', resize); resize();

let alpha = 1;
function tick() {
  if (alpha < 0.005) return;
  for (const n of nodes) { n.vx -= n.x * 0.002 * alpha; n.vy -= n.y * 0.002 * alpha; }
  for (let i=0;i<nodes.length;i++) for (let j=i+1;j<nodes.length;j++) {
    const a=nodes[i], b=nodes[j]; let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy;
    if (d2 > 90000) continue; if (d2 < 1) { dx = Math.random()-0.5; dy = Math.random()-0.5; d2 = 1; }
    const d=Math.sqrt(d2), f = Math.min(900/d2, 5) * alpha; dx/=d; dy/=d;
    a.vx-=dx*f; a.vy-=dy*f; b.vx+=dx*f; b.vy+=dy*f;
  }
  for (const l of links) {
    let dx=l.t.x-l.s.x, dy=l.t.y-l.s.y, d=Math.hypot(dx,dy)||0.01;
    const f=(d-90)*0.01*alpha; dx/=d; dy/=d;
    l.s.vx+=dx*f; l.s.vy+=dy*f; l.t.vx-=dx*f; l.t.vy-=dy*f;
  }
  for (const n of nodes) {
    n.vx*=0.6; n.vy*=0.6;
    const sp = Math.hypot(n.vx, n.vy); if (sp > 20) { n.vx *= 20/sp; n.vy *= 20/sp; }
    if (!isFinite(n.vx) || !isFinite(n.vy)) { n.vx = n.vy = 0; }
    n.x+=n.vx; n.y+=n.vy;
  }
  alpha *= 0.99;
  if (alpha < 0.005) fitView();
}
function fitView(){
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for (const n of nodes) { minX=Math.min(minX,n.x); maxX=Math.max(maxX,n.x); minY=Math.min(minY,n.y); maxY=Math.max(maxY,n.y); }
  const w = canvas.clientWidth, h = canvas.clientHeight; if (!isFinite(minX) || !w || !h) return;
  view.k = Math.max(0.2, Math.min(2, 0.9 * Math.min(w/(maxX-minX+40), h/(maxY-minY+40))));
  view.x = -(minX+maxX)/2*view.k; view.y = -(minY+maxY)/2*view.k;
}
function visible(n){
  if (kindFilter && n.group !== kindFilter) return false;
  if (query && !n.id.toLowerCase().includes(query)) return false;
  return true;
}
function draw() {
  const w = canvas.width, h = canvas.height, dpr = devicePixelRatio;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,w,h);
  ctx.translate(w/2 + view.x*dpr, h/2 + view.y*dpr); ctx.scale(view.k*dpr, view.k*dpr);
  const near = selected ? new Set(links.filter(l=>l.s===selected||l.t===selected).flatMap(l=>[l.s.id,l.t.id])) : null;
  for (const l of links) {
    const on = !selected || l.s===selected || l.t===selected;
    ctx.strokeStyle = on ? (l.conf === 'INFERRED' ? 'rgba(248,113,113,.55)' : 'rgba(148,163,184,.35)') : 'rgba(148,163,184,.07)';
    ctx.lineWidth = on && selected ? 1.6 : 0.7;
    if (l.conf === 'INFERRED') ctx.setLineDash([4,3]); else ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(l.s.x,l.s.y); ctx.lineTo(l.t.x,l.t.y); ctx.stroke();
  }
  ctx.setLineDash([]);
  for (const n of nodes) {
    const dim = !visible(n) || (near && !near.has(n.id) && n !== selected);
    ctx.globalAlpha = dim ? 0.15 : 1;
    ctx.fillStyle = n.missing ? '#ef4444' : (COLORS[n.group] || '#cbd5e1');
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI*2); ctx.fill();
    if (n === selected) { ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); }
    if (view.k > 0.75 && (!dim) && (n.r > 7 || n === selected)) {
      ctx.globalAlpha = dim ? 0.15 : 0.85; ctx.fillStyle = '#e2e8f0'; ctx.font = '9px system-ui';
      ctx.fillText(n.id.split('/').pop(), n.x + n.r + 3, n.y + 3);
    }
  }
  ctx.globalAlpha = 1;
}
function loop(){ tick(); draw(); requestAnimationFrame(loop); } loop();

function toWorld(ev){
  const rect = canvas.getBoundingClientRect();
  return { x: (ev.clientX - rect.left - rect.width/2 - view.x)/view.k, y: (ev.clientY - rect.top - rect.height/2 - view.y)/view.k };
}
let drag = null;
canvas.addEventListener('mousedown', e => { drag = { x:e.clientX, y:e.clientY, vx:view.x, vy:view.y }; });
window.addEventListener('mousemove', e => { if (drag) { view.x = drag.vx + e.clientX - drag.x; view.y = drag.vy + e.clientY - drag.y; } });
window.addEventListener('mouseup', () => { drag = null; });
canvas.addEventListener('wheel', e => { e.preventDefault(); view.k = Math.max(0.2, Math.min(4, view.k * (e.deltaY < 0 ? 1.12 : 0.89))); }, { passive:false });
canvas.addEventListener('click', e => {
  const p = toWorld(e);
  selected = nodes.filter(visible).find(n => Math.hypot(n.x-p.x, n.y-p.y) < n.r + 4) || null;
  showSide();
});
function showSide(){
  const side = document.getElementById('side');
  if (!selected) { side.innerHTML = '<p class="stat">Click any dot to see what it connects to.</p>'; return; }
  const out = links.filter(l => l.s === selected), inc = links.filter(l => l.t === selected);
  const li = l => '<li>' + (l.s === selected ? l.t.id : l.s.id) + ' <span class="tag">' + l.kind + '</span>'
    + (l.conf === 'INFERRED' ? ' <span class="tag" style="color:#f87171">unresolved</span>' : '') + '</li>';
  side.innerHTML = '<h2>' + selected.id + '</h2>'
    + '<p class="stat">' + selected.group + (selected.lines ? ' - ' + selected.lines + ' lines' : '') + '</p>'
    + '<strong>Uses (' + out.length + ')</strong><ul>' + (out.map(li).join('') || '<li>nothing</li>') + '</ul>'
    + '<strong>Used by (' + inc.length + ')</strong><ul>' + (inc.map(li).join('') || '<li>nothing</li>') + '</ul>';
}
document.getElementById('q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); });
canvas.addEventListener('dblclick', fitView);
kindSel.addEventListener('change', e => { kindFilter = e.target.value; });
</script>
</body>
</html>
